<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151518" />
    <title>My Notes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='3' fill='none' stroke='%230A84FF' stroke-width='2.5'/%3E%3C/svg%3E" />
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        background: #151518;
        color: #f2f2f2;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      }
      #initial-splash-shell {
        position: fixed;
        inset: 0;
        background: #151518;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 99;
        pointer-events: none;
      }
      #initial-splash-shell .splash-title {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f2f2f2;
      }
      #initial-splash-shell .splash-sub {
        font-size: 12px;
        color: #8a8a8e;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash-shell" aria-hidden="true">
        <svg width="112" height="112" viewBox="0 0 120 120">
          <rect x="26" y="14" width="68" height="92" rx="10" fill="#1c1c21" stroke="#f2f2f2" stroke-width="3" />
          <path d="M38 14v92" stroke="#f2f2f2" stroke-width="3" />
          <path d="M50 44c10-10 18 10 28 0s8-8 8-8M50 68c14-8 22 8 34-2" fill="none" stroke="#0A84FF" stroke-width="4" stroke-linecap="round" />
        </svg>
        <div class="splash-title">My Notes</div>
        <div class="splash-sub">Local-First Tablet Notebook</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
